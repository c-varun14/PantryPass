<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="PantryPass: a surplus-food handoff tracker where only the receiver can report what was distributed.">
  <title>PantryPass</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="apple-touch-icon" href="img/logo-180.png">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/polish.css">
  <link rel="stylesheet" href="css/pages.css">
  <link rel="stylesheet" href="css/lotview.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/archgraph.css">
  <link rel="stylesheet" href="css/photos.css">
  <link rel="stylesheet" href="css/fund.css">
</head>
<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <div id="offline-banner" class="offline-banner" role="status" hidden>You look offline. Showing the last data we had.</div>
  <header class="app-header" id="app-header">
    <a class="brand" href="#/"><span class="brand-mark" aria-hidden="true"><img src="img/logo-mark.svg" alt="" width="36" height="36"></span><span class="brand-name">PantryPass</span></a>
    <div id="account" class="account"></div>
  </header>
  <nav id="nav" class="app-nav" aria-label="Main"></nav>
  <main id="view" class="app-main" tabindex="-1"></main>
  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <noscript>PantryPass needs JavaScript.</noscript>
  <script src="config.js"></script>
  <script type="module" src="js/main.js"></script>

</html>
